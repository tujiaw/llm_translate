<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Translation</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="settings-section">
      <h2>LLM Translation</h2>
      
      <div class="language-preference-row">
        <div class="language-preference">
          <select id="nativeLanguage">
            <!-- 选项将通过JavaScript动态加载 -->
          </select>
          <div class="controls">
            <button id="translateBtn" title="Translate selected text">Text</button>
            <button id="translateWebpageBtn" title="Translate current webpage">Page</button>
            <button id="clearTranslationsBtn" title="Clear webpage translations" class="clear-btn">Clear</button>
          </div>
        </div>
      </div>
      
      <div class="translation-area">
        <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
        <div class="result-container">
          <textarea id="outputText" placeholder="Translation result..." readonly></textarea>
          <div class="spinner" id="loadingSpinner"></div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h2 class="collapsible-header" id="modelSectionHeader">
        Model Selection
        <span class="collapse-icon">▼</span>
      </h2>
      <div class="collapsible-content hidden" id="modelSectionContent">
        <div class="model-toolbar">
          <label class="model-toolbar-label" for="modelSelect">模型配置</label>
          <div class="model-toolbar-row">
            <select id="modelSelect"></select>
            <button type="button" id="addModelBtn" class="toolbar-btn">添加</button>
            <button type="button" id="removeModelBtn" class="toolbar-btn">删除</button>
          </div>
        </div>

        <div id="modelEditor" class="model-editor">
          <label class="field-label" for="modelLabel">显示名称（可选）</label>
          <input type="text" id="modelLabel" placeholder="下拉列表中显示的名称">

          <label class="field-label" for="modelBaseUrl">Base URL</label>
          <input type="text" id="modelBaseUrl" placeholder="https://api.deepseek.com/v1/chat/completions" autocomplete="off">

          <label class="field-label" for="modelName">Model</label>
          <input type="text" id="modelName" placeholder="模型 ID，如 gpt-4o-mini" autocomplete="off">

          <label class="field-label" for="modelApiKey">API Key</label>
          <div class="key-input-container">
            <input type="password" id="modelApiKey" placeholder="API Key" autocomplete="off">
            <button type="button" id="showModelKeyBtn" class="show-key-btn"><img src="images/eye-close.png" alt="Show" class="eye-icon"></button>
          </div>

          <label class="field-label" for="modelBodyJson">自定义 Body JSON（可选，合并到请求体）</label>
          <textarea id="modelBodyJson" rows="4" placeholder='例如 {"temperature": 0.5, "max_tokens": 2048}'></textarea>
        </div>
      </div>
    </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
