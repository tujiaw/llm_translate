<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>LLM Translation Preview</title>
  <link rel="stylesheet" href="popup.css">
  <script>
    // ===== 临时预览用 chrome API 桩（仅用于本地视觉验证）=====
    window.chrome = {
      runtime: {
        getURL: function (path) { return path; },
        lastError: null
      },
      storage: {
        local: {
          _data: {
            nativeLanguage: 'zh',
            currentModelId: 'm1',
            models: [{
              id: 'volcengine::doubao-pro-32k',
              providerId: 'volcengine',
              baseUrl: 'https://ark.cn-beijing.volces.com/api/v3',
              model: 'doubao-pro-32k',
              apiKey: 'sk-test-123',
              bodyJson: '{}'
            }]
          },
          get: function (defaults, cb) {
            if (typeof defaults === 'function') { cb = defaults; defaults = {}; }
            const result = {};
            for (const k of Object.keys(defaults)) {
              result[k] = (k in this._data) ? this._data[k] : defaults[k];
            }
            window.chrome.runtime.lastError = null;
            cb(result);
          },
          set: function (payload, cb) {
            Object.assign(this._data, payload);
            window.chrome.runtime.lastError = null;
            if (cb) cb();
          }
        },
        sync: {
          _data: {},
          get: function (defaults, cb) {
            if (typeof defaults === 'function') { cb = defaults; defaults = {}; }
            const result = {};
            for (const k of Object.keys(defaults)) {
              result[k] = (k in this._data) ? this._data[k] : defaults[k];
            }
            window.chrome.runtime.lastError = null;
            cb(result);
          },
          set: function (payload, cb) {
            Object.assign(this._data, payload);
            window.chrome.runtime.lastError = null;
            if (cb) cb();
          }
        }
      },
      tabs: {
        query: async function () { return [{ id: 1 }]; },
        sendMessage: async function (tabId, message) {
          const action = message && message.action;
          if (action === 'getSelectedText') return { selectedText: 'This is a sample text to translate.' };
          if (action === 'getWebpageTranslationState') return { hasTranslations: false, hidden: false };
          if (action === 'translateWebpage') return { success: true };
          if (action === 'toggleWebpageTranslations') return { success: true, hidden: true };
          if (action === 'clearWebpageTranslations') return { success: true };
          return { success: true };
        }
      }
    };

    // ===== 根据 URL 参数应用预览状态（仅用于截图验证）=====
    window.addEventListener('load', function () {
      const params = new URLSearchParams(location.search);
      const timer = setInterval(function () {
        const nameEl = document.getElementById('modelBarName');
        const langEl = document.getElementById('nativeLanguage');
        if (!nameEl || !langEl || langEl.options.length === 0) return;
        clearInterval(timer);

        if (params.get('filled')) {
          const input = document.getElementById('inputText');
          input.value = 'Hello, this is an example sentence to translate.';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          if (params.get('output')) {
            const out = document.getElementById('outputText');
            out.value = '你好，这是一个用于展示译文区域样式的示例句子。';
            document.getElementById('copyBtn').classList.remove('hidden');
          }
        }
        if (params.get('view') === 'settings') {
          document.getElementById('modelBar').click();
          if (params.get('advanced')) {
            document.getElementById('advancedJson').open = true;
          }
        }
        if (params.get('mode') === 'page') {
          document.getElementById('pageModeBtn').click();
        }
      }, 100);
    });
  </script>
</head>
<body>
  <div class="container">

    <!-- ============ 主视图：翻译 ============ -->
    <div id="mainView" class="view">
      <header class="popup-header">
        <h1 class="popup-title">LLM Translation</h1>
        <button type="button" id="openSettingsBtn" class="icon-btn" title="模型设置" aria-label="模型设置">⚙</button>
      </header>

      <!-- 模式切换：文本翻译 / 网页翻译 -->
      <div class="mode-switch" role="tablist" aria-label="翻译模式">
        <button type="button" id="pageModeBtn" class="mode-segment active" role="tab" aria-selected="true">网页翻译</button>
        <button type="button" id="textModeBtn" class="mode-segment" role="tab" aria-selected="false">文本翻译</button>
      </div>

      <!-- 目标语言 -->
      <div class="target-lang-row">
        <label class="field-label" for="nativeLanguage">翻译为</label>
        <select id="nativeLanguage"></select>
      </div>

      <!-- 文本翻译面板 -->
      <section id="textPanel" class="panel hidden">
        <div class="field-row">
          <span class="field-label">原文</span>
        </div>
        <textarea id="inputText" placeholder="输入要翻译的内容…"></textarea>

        <div class="action-row">
          <button type="button" id="translateBtn" class="btn btn-primary" disabled>翻译</button>
          <button type="button" id="clearTextBtn" class="btn-text hidden">清空</button>
        </div>

        <div class="field-row">
          <span class="field-label">译文</span>
          <button type="button" id="copyBtn" class="btn-text hidden">复制</button>
        </div>
        <div class="output-wrap">
          <textarea id="outputText" placeholder="翻译结果" readonly></textarea>
          <div class="spinner" id="loadingSpinner"></div>
        </div>
      </section>

      <!-- 网页翻译面板 -->
      <section id="pagePanel" class="panel">
        <button type="button" id="translateWebpageBtn" class="btn btn-primary btn-block">翻译当前网页</button>

        <span class="field-label">翻译后</span>
        <div class="page-actions">
          <button type="button" id="togglePageBtn" class="btn btn-secondary" disabled>显示原文</button>
          <button type="button" id="clearWebpageBtn" class="btn btn-secondary" disabled>恢复网页</button>
        </div>
        <p id="pageStatus" class="page-status" role="status"></p>
      </section>

      <!-- 模型栏（折叠态，点击进入模型设置） -->
      <button type="button" id="modelBar" class="model-bar">
        <span class="model-bar-left">
          <span class="field-label">模型</span>
          <span id="modelBarName" class="model-bar-name">未配置</span>
        </span>
        <span class="model-bar-right">
          <span id="modelBarBadge" class="status-badge">未配置</span>
          <span class="chevron">›</span>
        </span>
      </button>
    </div>

    <!-- ============ 模型设置视图 ============ -->
    <div id="settingsView" class="view hidden">
      <header class="settings-header">
        <button type="button" id="backBtn" class="icon-btn" title="返回" aria-label="返回">←</button>
        <h1 class="popup-title">模型设置</h1>
      </header>

      <!-- 已保存的模型：用服务商 · 模型 ID 展示 -->
      <label class="field-label" for="modelSelect">已保存的模型</label>
      <div class="current-model-row">
        <select id="modelSelect"></select>
        <button type="button" id="addModelBtn" class="btn btn-secondary">＋ 添加</button>
      </div>

      <div class="divider"></div>

      <div id="modelEditor" class="model-editor">
        <label class="field-label" for="modelProvider">服务商</label>
        <select id="modelProvider"></select>
        <p class="field-hint" id="modelProviderHint"></p>

        <label class="field-label" for="modelName">模型 ID</label>
        <input type="text" id="modelName" placeholder="如 deepseek-chat、doubao-pro-32k" autocomplete="off">

        <label class="field-label" for="modelApiKey">API Key</label>
        <div class="key-input-container">
          <input type="password" id="modelApiKey" placeholder="粘贴该服务商的 API Key" autocomplete="off">
          <button type="button" id="showModelKeyBtn" class="show-key-btn" title="显示/隐藏" aria-label="显示或隐藏 API Key">
            <img src="images/eye-close.png" alt="Show" class="eye-icon">
          </button>
        </div>
        <p class="field-hint">Key 只保存在本机，且只用于当前服务商，不会带到其他服务商。</p>

        <details class="advanced-json" id="advancedJson">
          <summary>高级选项（可选）</summary>
          <label class="field-label" for="modelBaseUrl">接口地址</label>
          <input type="text" id="modelBaseUrl" placeholder="https://api.deepseek.com/v1" autocomplete="off">
          <p class="field-hint">可只填到 /v1，扩展会自动补全 /chat/completions。</p>
          <label class="field-label" for="modelBodyJson">自定义 Body JSON，会合并到请求体</label>
          <textarea id="modelBodyJson" rows="3" placeholder='例如 {"temperature": 0.5}'></textarea>
        </details>

        <div class="model-test-row">
          <button type="button" id="testModelBtn" class="btn btn-secondary">测试连接</button>
          <button type="button" id="saveModelBtn" class="btn btn-primary">保存配置</button>
        </div>
        <span id="modelTestStatus" class="model-test-status" role="status"></span>

        <button type="button" id="removeModelBtn" class="btn-danger">删除此配置</button>
      </div>
    </div>

  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
